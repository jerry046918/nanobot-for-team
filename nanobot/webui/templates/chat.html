{% extends "base.html" %}

{% block nav_chat %}active{% endblock %}

{% block title %}nanobot - Chat{% endblock %}

{% block head %}
<style>
/* ─── Chat Layout ──────────────────────────────────────────────── */

.chat-layout {
    display: flex;
    height: calc(100vh - 56px);
    overflow: hidden;
}

/* ─── Chat Sidebar ─────────────────────────────────────────────── */

.chat-sidebar {
    width: 260px;
    background: var(--bg-surface);
    border-right: 1px solid var(--border-default);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.chat-sidebar-header {
    padding: var(--sp-4);
    border-bottom: 1px solid var(--border-default);
}

.chat-sidebar-title {
    font-size: var(--text-xs);
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: var(--sp-2);
}

.chat-sessions-list {
    flex: 1;
    overflow-y: auto;
    padding: var(--sp-2);
}

/* ─── Session Items ────────────────────────────────────────────── */

.chat-session-item {
    padding: var(--sp-3);
    margin-bottom: var(--sp-1);
    background: var(--bg-surface);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all var(--transition-normal);
    border-left: 2px solid transparent;
}

.chat-session-item:hover {
    background: var(--bg-elevated);
    border-left-color: var(--accent-primary);
}

.chat-session-item.active {
    background: var(--bg-elevated);
    border-left-color: var(--accent-primary);
}

.chat-session-item.active .chat-session-key {
    color: var(--text-primary);
}

.chat-session-key {
    font-size: var(--text-base);
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 0.25rem;
    word-break: break-all;
}

.chat-session-meta {
    font-size: var(--text-xs);
    color: var(--text-tertiary);
}

/* ─── Chat Main Area ───────────────────────────────────────────── */

.chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.chat-messages-container {
    flex: 1;
    overflow-y: auto;
    padding: var(--sp-5);
}

/* ─── Message Bubbles ──────────────────────────────────────────── */

.chat-message {
    display: flex;
    gap: var(--sp-3);
    margin-bottom: var(--sp-4);
}

.chat-message.user {
    justify-content: flex-end;
}

.chat-message-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--text-xs);
    font-weight: 600;
    flex-shrink: 0;
    color: white;
    background: var(--accent-gradient);
}

.chat-message.assistant .chat-message-avatar {
    background: var(--bg-elevated);
    color: var(--accent-primary);
}

.chat-message-content {
    max-width: 70%;
    padding: var(--sp-3) var(--sp-4);
    font-size: var(--text-base);
    line-height: 1.7;
    color: var(--text-primary);
}

.chat-message.user .chat-message-content {
    background: var(--accent-gradient);
    color: white;
    border-radius: var(--radius-md) var(--radius-md) 0 var(--radius-md);
}

.chat-message.assistant .chat-message-content {
    background: var(--bg-surface);
    color: var(--text-primary);
    border-radius: var(--radius-md) var(--radius-md) var(--radius-md) 0;
    border-left: 3px solid var(--accent-primary);
}

.chat-message-time {
    font-size: var(--text-xs);
    color: var(--text-tertiary);
    margin-top: var(--sp-1);
}

.chat-message.user .chat-message-time {
    color: rgba(255, 255, 255, 0.7);
}

/* ─── Input Area ───────────────────────────────────────────────── */

.chat-input-container {
    padding: var(--sp-4) var(--sp-5);
    background: var(--bg-base);
    border-top: 1px solid var(--border-default);
}

.chat-input-wrapper {
    display: flex;
    gap: var(--sp-2);
    align-items: flex-end;
}

.chat-input-textarea {
    flex: 1;
    min-height: 44px;
    max-height: 200px;
    padding: var(--sp-3) var(--sp-4);
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-size: var(--text-base);
    resize: none;
    font-family: var(--font-sans);
    line-height: 1.5;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.chat-input-textarea:focus {
    outline: none;
    border-color: var(--border-focus);
    box-shadow: var(--shadow-glow);
}

.chat-send-button {
    height: 44px;
    padding: var(--sp-3) var(--sp-5);
    background: var(--accent-gradient);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all var(--transition-fast);
    font-weight: 600;
    font-size: var(--text-base);
    font-family: var(--font-sans);
}

.chat-send-button:hover {
    filter: brightness(1.1);
}

.chat-send-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    filter: none;
}

/* ─── Connection Status ────────────────────────────────────────── */

.connection-status {
    padding: var(--sp-1) var(--sp-3);
    font-size: var(--text-xs);
    font-weight: 500;
    border-radius: var(--radius-full);
    display: inline-block;
    margin-bottom: var(--sp-2);
}

.connection-status.connected {
    background: rgba(34, 197, 94, 0.1);
    color: var(--color-success);
}

.connection-status.disconnected {
    background: rgba(239, 68, 68, 0.1);
    color: var(--color-error);
}

.connection-status.connecting {
    background: rgba(245, 158, 11, 0.1);
    color: var(--color-warning);
}

/* ─── Empty State ──────────────────────────────────────────────── */

.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
}

.empty-state-icon {
    width: 40px;
    height: 40px;
    margin-bottom: var(--sp-4);
    color: var(--text-tertiary);
    opacity: 0.5;
}

.empty-state-text {
    font-size: var(--text-md);
    color: var(--text-secondary);
    margin-bottom: var(--sp-2);
}

.empty-state-subtext {
    font-size: var(--text-sm);
    color: var(--text-tertiary);
}

/* ─── Progress Indicator ───────────────────────────────────────── */

.chat-progress-content {
    font-style: italic;
    color: var(--text-tertiary);
}

.chat-progress-content .progress-text::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-primary);
    margin-right: var(--sp-2);
    animation: pulse 1.4s ease-in-out infinite;
    vertical-align: middle;
}

@keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
}

/* ─── Responsive ───────────────────────────────────────────────── */

@media (max-width: 768px) {
    .chat-sidebar {
        display: none;
    }

    .chat-message-content {
        max-width: 85%;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="chat-layout">
    <!-- Sidebar with session list -->
    <div class="chat-sidebar">
        <div class="chat-sidebar-header">
            <div class="chat-sidebar-title">Sessions</div>
        </div>
        <div class="chat-sessions-list" id="sessions-list" hx-get="/api/sessions" hx-trigger="load" hx-swap="innerHTML">
            <!-- Sessions will be loaded here via HTMX -->
            <div class="chat-session-item">
                <div class="chat-session-key">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Main chat area -->
    <div class="chat-main">
        <div class="chat-messages-container" id="chat-messages">
            <div class="empty-state">
                <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <div class="empty-state-text">No messages yet</div>
                <div class="empty-state-subtext">Start a conversation by typing a message below</div>
            </div>
        </div>

        <div class="chat-input-container">
            <div class="connection-status connecting" id="connection-status">Connecting...</div>
            <div class="chat-input-wrapper">
                <textarea
                    class="chat-input-textarea"
                    id="chat-input"
                    placeholder="Type your message..."
                    rows="1"
                ></textarea>
                <button class="chat-send-button" id="send-button" disabled>Send</button>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const messagesContainer = document.getElementById('chat-messages');
    const input = document.getElementById('chat-input');
    const sendButton = document.getElementById('send-button');
    const statusElement = document.getElementById('connection-status');
    const sessionsList = document.getElementById('sessions-list');

    let ws = null;
    let currentSession = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT_ATTEMPTS = 5;

    // Get session ID from template variable (cookie is HttpOnly, JS can't read it)
    function getSessionId() {
        return {{ ws_session_id | tojson }};
    }

    // Connect to WebSocket
    function connect() {
        const sessionId = getSessionId();
        if (!sessionId) {
            setStatus('disconnected', 'No session');
            return;
        }

        setStatus('connecting', 'Connecting...');

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/chat?session_id=${sessionId}`;

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            setStatus('connected', 'Connected');
            sendButton.disabled = false;
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            handleMessage(data);
        };

        ws.onclose = () => {
            setStatus('disconnected', 'Disconnected');
            sendButton.disabled = true;

            // Attempt to reconnect with exponential backoff
            if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                setTimeout(connect, delay);
                reconnectAttempts++;
            } else {
                setStatus('disconnected', 'Max reconnection attempts reached');
            }
        };

        ws.onerror = () => {
            setStatus('disconnected', 'Connection error');
            sendButton.disabled = true;
        };
    }

    // Set connection status
    function setStatus(state, text) {
        statusElement.className = `connection-status ${state}`;
        statusElement.textContent = text;
    }

    // Streaming state
    let streamingMessageEl = null;
    let streamingContent = '';

    // Handle incoming message
    function handleMessage(data) {
        if (data.type === 'progress') {
            // Show tool call progress
            if (data.tool_hint) {
                showProgress(data.content);
            }
        } else if (data.type === 'stream') {
            // Streaming text delta — append to current message
            if (!streamingMessageEl) {
                streamingMessageEl = createMessageEl('assistant', '');
                streamingContent = '';
            }
            streamingContent += data.content;
            updateMessageContent(streamingMessageEl, streamingContent);
        } else if (data.type === 'stream_end') {
            // Stream finished — if resuming, agent will make more tool calls
            if (!data.resuming && streamingMessageEl) {
                streamingMessageEl = null;
                streamingContent = '';
            }
            hideProgress();
        } else if (data.type === 'text') {
            // Final complete response
            hideProgress();
            if (streamingMessageEl && !data.content) {
                // Response was already streamed
                streamingMessageEl = null;
                streamingContent = '';
            } else if (data.content) {
                // Non-streamed final response
                streamingMessageEl = null;
                streamingContent = '';
                addMessage('assistant', data.content);
            }
            // Refresh session list after response
            loadSessions();
        } else if (data.type === 'error') {
            hideProgress();
            streamingMessageEl = null;
            streamingContent = '';
            addMessage('system', data.content);
        }
    }

    // Add message to chat
    function addMessage(role, content) {
        const messageDiv = createMessageEl(role, content);
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Create a message element
    function createMessageEl(role, content) {
        // Remove empty state if present
        const emptyState = messagesContainer.querySelector('.empty-state');
        if (emptyState) {
            emptyState.remove();
        }

        const messageDiv = document.createElement('div');
        messageDiv.className = `chat-message ${role}`;

        const avatar = document.createElement('div');
        avatar.className = 'chat-message-avatar';
        avatar.textContent = role === 'user' ? 'U' : role === 'system' ? '!' : 'A';

        const contentDiv = document.createElement('div');
        contentDiv.className = 'chat-message-content';
        contentDiv.textContent = content;

        const timeDiv = document.createElement('div');
        timeDiv.className = 'chat-message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();

        contentDiv.appendChild(timeDiv);
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(contentDiv);
        messagesContainer.appendChild(messageDiv);

        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        return messageDiv;
    }

    // Update streaming message content
    function updateMessageContent(messageDiv, content) {
        const contentDiv = messageDiv.querySelector('.chat-message-content');
        if (contentDiv) {
            const timeDiv = contentDiv.querySelector('.chat-message-time');
            contentDiv.textContent = content;
            if (timeDiv) contentDiv.appendChild(timeDiv);
        }
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Progress indicator
    function showProgress(text) {
        let el = document.getElementById('chat-progress');
        if (!el) {
            el = document.createElement('div');
            el.id = 'chat-progress';
            el.className = 'chat-message assistant';
            el.innerHTML = `
                <div class="chat-message-avatar">A</div>
                <div class="chat-message-content" style="color: var(--text-muted); font-style: italic;">
                    <span class="progress-text"></span>
                </div>
            `;
            messagesContainer.appendChild(el);
        }
        el.querySelector('.progress-text').textContent = text;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function hideProgress() {
        const el = document.getElementById('chat-progress');
        if (el) el.remove();
    }

    // Send message
    function sendMessage() {
        const content = input.value.trim();
        if (!content || !ws || ws.readyState !== WebSocket.OPEN) {
            return;
        }

        // Add user message to chat
        addMessage('user', content);

        // Send via WebSocket
        ws.send(JSON.stringify({ message: content }));

        // Clear input
        input.value = '';
        input.style.height = 'auto';
    }

    // Auto-resize textarea
    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    });

    // Send on Enter (Shift+Enter for new line)
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Send button click
    sendButton.addEventListener('click', sendMessage);

    // Initial connection
    connect();

    // Reset reconnect attempts on successful connection
    ws.onopen = () => {
        setStatus('connected', 'Connected');
        sendButton.disabled = false;
        reconnectAttempts = 0;
    };

    // Load sessions periodically
    function loadSessions() {
        fetch('/api/sessions')
            .then(response => response.json())
            .then(sessions => {
                sessionsList.innerHTML = '';
                sessions.forEach(session => {
                    const item = document.createElement('div');
                    item.className = 'chat-session-item';
                    item.dataset.key = session.key;
                    if (session.key === currentSession) {
                        item.classList.add('active');
                    }
                    item.innerHTML = `
                        <div class="chat-session-key">${escapeHtml(session.key)}</div>
                        <div class="chat-session-meta">${formatDate(session.updated_at)}</div>
                    `;
                    item.addEventListener('click', () => loadSessionHistory(session.key));
                    sessionsList.appendChild(item);
                });
            })
            .catch(error => console.error('Failed to load sessions:', error));
    }

    // Load session history
    function loadSessionHistory(key) {
        currentSession = key;
        fetch(`/api/sessions/${encodeURIComponent(key)}/history`)
            .then(response => response.json())
            .then(messages => {
                messagesContainer.innerHTML = '';
                if (messages.length === 0) {
                    messagesContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">💬</div>
                            <div class="empty-state-text">No messages in this session</div>
                        </div>
                    `;
                } else {
                    messages.forEach(msg => {
                        if (msg.content) {
                            addMessage(msg.role, msg.content);
                        }
                    });
                }
                // Update active session in sidebar
                document.querySelectorAll('.chat-session-item').forEach(item => {
                    item.classList.toggle('active', item.dataset.key === key);
                });
            })
            .catch(error => console.error('Failed to load session history:', error));
    }

    // Utility functions
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatDate(dateString) {
        if (!dateString) return 'Unknown';
        const date = new Date(dateString);
        return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
    }

    // Initial load and periodic refresh
    loadSessions();
    setInterval(loadSessions, 30000); // Refresh every 30 seconds
})();
</script>
{% endblock %}
